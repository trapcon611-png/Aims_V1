version: '3.8'

# Professional logging configuration to prevent disk bloat
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: aims_postgres
    logging: *default-logging
    environment:
      POSTGRES_USER: aims_manual
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SecurePassword123!}
      POSTGRES_DB: aims_manual
    ports:
      - "5432:5432"
    volumes:
      - aims_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # 2. NestJS Backend Service
  aims_backend:
    build:
      context: ./aims_backend
      dockerfile: Dockerfile
    container_name: aims_backend
    logging: *default-logging
    ports:
      - "3001:3001"
    env_file:
      - ./aims_backend/.env
    environment:
      - DATABASE_URL=postgresql://aims_manual:${POSTGRES_PASSWORD:-SecurePassword123!}@postgres:5432/aims_manual?schema=public
    depends_on:
      - postgres
    restart: unless-stopped
    volumes:
      - ./backups:/app/backups

  # 3. Next.js Frontend Service
  aims_frontend:
    build:
      context: ./aims_institute_app
      dockerfile: Dockerfile
      # ✨ THE FIX: 'args' injects variables directly into the Next.js BUILD process
      args:
        - NEXT_PUBLIC_RAZORPAY_KEY_ID=rzp_live_SMgmgIgW1pxhhB
        - NEXT_PUBLIC_API_URL=http://76.13.247.225:3001
    container_name: aims_frontend
    logging: *default-logging
    ports:
      - "3000:3000"
    # We keep this here just for safety during runtime
    environment: 
      - NEXT_PUBLIC_RAZORPAY_KEY_ID=rzp_live_SMgmgIgW1pxhhB
      - NEXT_PUBLIC_API_URL=http://76.13.247.225:3001
    env_file:
      - ./aims_institute_app/.env
    depends_on:
      - aims_backend
    restart: unless-stopped

volumes:
  aims_pgdata: