version: '3.8'

# Professional logging configuration to prevent disk bloat
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: aims_postgres
    logging: *default-logging
    environment:
      # Updated to match the credentials from your .env files!
      POSTGRES_USER: aims_manual
      POSTGRES_PASSWORD: Sameer
      POSTGRES_DB: aims_manual
    ports:
      - "5432:5432"
    volumes:
      - aims_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # 2. NestJS Backend Service
  aims_backend:
    build:
      context: ./aims_backend
      dockerfile: Dockerfile
    container_name: aims_backend
    logging: *default-logging
    ports:
      - "3001:3001"
    # TELLS DOCKER TO INJECT EVERYTHING FROM YOUR .ENV FILE
    env_file:
      - ./aims_backend/.env
    environment:
      # Overrides the 'localhost' from your .env to 'postgres' so Docker can connect internally
      - DATABASE_URL=postgresql://aims_manual:Sameer@postgres:5432/aims_manual?schema=public
    depends_on:
      - postgres
    restart: unless-stopped
    volumes:
      - ./backups:/app/backups

  # 3. Next.js Frontend Service
  aims_frontend:
    build:
      context: ./aims_institute_app
      dockerfile: Dockerfile
      # Next.js will naturally read your ./aims_institute_app/.env file during the build phase!
    container_name: aims_frontend
    logging: *default-logging
    ports:
      - "3000:3000"
    # TELLS DOCKER TO INJECT EVERYTHING FROM YOUR FRONTEND .ENV FILE
    env_file:
      - ./aims_institute_app/.env
    depends_on:
      - aims_backend
    restart: unless-stopped

volumes:
  aims_pgdata: