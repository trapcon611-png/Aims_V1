version: '3.8'

# Professional logging configuration to prevent disk bloat
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: aims_postgres
    logging: *default-logging
    environment:
      POSTGRES_USER: aims_manual
      POSTGRES_PASSWORD: Sameer
      POSTGRES_DB: aims_manual
    ports:
      - "5432:5432"
    volumes:
      - aims_pgdata:/var/lib/postgresql/data
    networks:
      - aims_network
    restart: unless-stopped

  # 2. NestJS Backend Service
  aims_backend:
    build:
      context: ./aims_backend
      dockerfile: Dockerfile
    container_name: aims_backend
    logging: *default-logging
    ports:
      - "3001:3001"
    env_file:
      - ./aims_backend/.env
    environment:
      - DATABASE_URL=postgresql://aims_manual:Sameer@postgres:5432/aims_manual?schema=public
      - OPENWA_API_URL=http://openwa:2785/api # ✨ FIXED: OpenWA runs on 2785
    depends_on:
      - postgres
    networks:
      - aims_network
    restart: unless-stopped
    volumes:
      - ./backups:/app/backups

  # 3. Next.js Frontend Service
  aims_frontend:
    build:
      context: ./aims_institute_app
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_RAZORPAY_KEY_ID=rzp_live_SMgmgIgW1pxhhB
        - NEXT_PUBLIC_API_URL=http://76.13.247.225:3001
    container_name: aims_frontend
    logging: *default-logging
    # ✨ FIXED: Bound to 127.0.0.1 so it cannot bypass Nginx
    ports:
      - "127.0.0.1:3000:3000"
    environment: 
      - NEXT_PUBLIC_RAZORPAY_KEY_ID=rzp_live_SMgmgIgW1pxhhB
      - NEXT_PUBLIC_API_URL=http://76.13.247.225:3001
    env_file:
      - ./aims_institute_app/.env
    depends_on:
      - aims_backend
    networks:
      - aims_network
    restart: unless-stopped

  # ✨ 4. NEW: OpenWA Service
  openwa:
    build:
      context: ./openwa/OpenWA-main/OpenWA-main
      dockerfile: Dockerfile
    container_name: aims_whatsapp_service
    logging: *default-logging
    # 👇 ADD THIS PORTS BLOCK 👇
    ports:
      - "2785:2785"
    # 👆 --------------------- 👆
    command: npm run start:prod # ✨ ADDED: Ensures the server actually boots
    restart: unless-stopped
    networks:
      - aims_network
    volumes:
      - ./openwa_data:/app/data
    depends_on:
      postgres:
        condition: service_started
    environment:
      - API_KEY=${OPENWA_API_KEY} 
      - DATABASE_URL=postgresql://aims_manual:Sameer@postgres:5432/aims_manual?schema=public # ✨ ADDED: DB connection
      - ENGINE_TYPE=baileys # ✨ ADDED: Required WhatsApp engine

networks:
  aims_network:
    driver: bridge

volumes:
  aims_pgdata: